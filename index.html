<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحدي المعلومات العامة - محمود حاتم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="min-h-screen text-white flex flex-col items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm">

  <div class="w-full max-w-xl bg-slate-900/80 backdrop-blur-md border border-white/20 rounded-2xl p-6 shadow-2xl relative overflow-hidden my-auto">
    
    <!-- Start Screen -->
    <div id="start-screen" class="text-center py-8">
      <div class="text-6xl mb-4">🧠</div>
      <h1 class="text-3xl font-extrabold mb-2 text-amber-300">تحدي المعلومات العامة</h1>
      <p class="text-xs text-indigo-200 mb-6 font-semibold bg-indigo-950/70 inline-block px-3 py-1 rounded-full border border-indigo-400/30">
        تطوير وبرمجة: محمود حاتم 👑
      </p>
      <p class="text-gray-200 mb-6 leading-relaxed">اختبر معلوماتك العامة في تحدي جديد!<br>الأسئلة تتغير بشكل عشوائي في كل مرة تلعب فيها.</p>
      <button id="start-btn" type="button" class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold px-8 py-3 rounded-xl transition duration-200 shadow-lg transform hover:-translate-y-1 cursor-pointer">
        ابدأ التحدي الآن 🚀
      </button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden">
      <!-- Header Info -->
      <div class="flex justify-between items-center mb-4 text-sm font-semibold">
        <span id="question-count" class="bg-indigo-950/80 px-3 py-1 rounded-full text-indigo-200">السؤال 1</span>
        <span id="score-count" class="bg-emerald-950/80 px-3 py-1 rounded-full text-emerald-300">النقاط: 0</span>
      </div>

      <!-- Progress Bar -->
      <div class="w-full bg-white/10 rounded-full h-2.5 mb-6 overflow-hidden">
        <div id="progress-bar" class="bg-amber-400 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>

      <!-- Question Text -->
      <h2 id="question-text" class="text-xl font-bold mb-6 text-right leading-snug text-amber-100 min-h-[60px] flex items-center">
      </h2>

      <!-- Options -->
      <div id="options-container" class="space-y-3">
      </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden text-center py-8">
      <div id="result-icon" class="text-6xl mb-4">🏆</div>
      <h2 class="text-2xl font-extrabold mb-2 text-amber-300">اكتمل التحدي!</h2>
      <p id="result-text" class="text-lg text-gray-200 mb-6"></p>
      
      <div class="bg-white/5 border border-white/10 rounded-xl p-4 mb-6">
        <span class="block text-sm text-gray-300">النتيجة النهائية</span>
        <span id="final-score" class="text-4xl font-extrabold text-amber-400">0</span>
      </div>

      <button id="restart-btn" type="button" class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold px-8 py-3 rounded-xl transition duration-200 shadow-lg cursor-pointer">
        إعادة التحدي 🔄
      </button>
    </div>

  </div>

  <!-- Footer -->
  <footer class="mt-6 text-center text-xs text-indigo-200/80 tracking-wide">
    جميع الحقوق محفوظة © | تم تطوير اللعبة بواسطة: <span class="font-bold text-amber-300">محمود حاتم</span>
  </footer>

  <script>
    // السؤال الأول الثابت دائمًا
    const fixedQuestion = { 
      q: "مين هو أجدع واحد عرفته في الجيش؟", 
      options: ["محمود حاتم", "أحمد أحمدي", "بسام عيد", "مصطفى صفوت"], 
      answer: 0 
    };

    // بنك باقي الأسئلة العامة
    const questionPool = [
      { q: "لو واحد طلب منك 100 جنيه؟", options: ["هتدي له", "مش هتدي له", "هتسأل صاحبك", "ما معيش فلوس والله"], answer: 3 },
      { q: "ما هي عاصمة مصر؟", options: ["القاهرة", "الإسكندرية", "الجيزة", "أسوان"], answer: 0 },
      { q: "كم عدد قارات العالم؟", options: ["5", "6", "7", "8"], answer: 2 },
      { q: "ما هو أطول نهر في العالم؟", options: ["الأمازون", "النيل", "الفرات", "الميسيسيبي"], answer: 1 },
      { q: "ما هو أسرع حيوان بري في العالم؟", options: ["الأسد", "الفهد", "الغزال", "النمر"], answer: 1 },
      { q: "ما هي كبرى المحيطات مساحة؟", options: ["الأطلسي", "الهندي", "الهادئ", "المتجمّد الشمالي"], answer: 2 },
      { q: "ما هو الكوكب الملقب بالكوكب الأحمر؟", options: ["المريخ", "الزهرة", "المشتري", "زحل"], answer: 0 },
      { q: "كم عدد أضلاع المثلث؟", options: ["2", "3", "4", "5"], answer: 1 },
      { q: "ما هي العملة الرسمية للمملكة العربية السعودية؟", options: ["الدرهم", "الجنيه", "الريال", "الدينار"], answer: 2 },
      { q: "في أي قارة تقع دولة اليابان؟", options: ["أوروبا", "إفريقيا", "آسيا", "أمريكا الشمالية"], answer: 2 },
      { q: "ما هو العنصر الأساسي للتنفس؟", options: ["النيتروجين", "الأوكسجين", "الهيدروجين", "كربون"], answer: 1 },
      { q: "كم عدد أسنان الشخص البالغ؟", options: ["28", "30", "32", "36"], answer: 2 }
    ];

    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let canAnswer = true;

    document.addEventListener('DOMContentLoaded', function() {
      const startBtn = document.getElementById('start-btn');
      const restartBtn = document.getElementById('restart-btn');

      if (startBtn) startBtn.addEventListener('click', startGame);
      if (restartBtn) restartBtn.addEventListener('click', startGame);
    });

    function startGame() {
      // إعداد الأسئلة: تثبيت السؤال الأول + اختيار أسئلة عشوائية من البنك
      const shuffledPool = [...questionPool].sort(() => 0.5 - Math.random());
      // بناخد السؤال الثابت أولاً + 9 أسئلة عشوائية ليصبح المجموع 10 أسئلة
      currentQuestions = [fixedQuestion, ...shuffledPool.slice(0, 9)];

      currentQuestionIndex = 0;
      score = 0;
      canAnswer = true;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');

      showQuestion();
    }

    function showQuestion() {
      canAnswer = true;
      const q = currentQuestions[currentQuestionIndex];

      document.getElementById('question-count').innerText = `السؤال ${currentQuestionIndex + 1} من ${currentQuestions.length}`;
      document.getElementById('score-count').innerText = `النقاط: ${score}`;
      document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / currentQuestions.length) * 100}%`;
      document.getElementById('question-text').innerText = q.q;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.type = "button";
        btn.className = "w-full text-right p-4 rounded-xl bg-white/10 hover:bg-white/20 border border-white/10 transition-all duration-200 flex justify-between items-center font-medium cursor-pointer";
        btn.innerText = opt;
        btn.addEventListener('click', function() {
          checkAnswer(idx, btn);
        });
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex, selectedBtn) {
      if (!canAnswer) return;
      canAnswer = false;

      const q = currentQuestions[currentQuestionIndex];
      const buttons = document.getElementById('options-container').children;

      if (selectedIndex === q.answer) {
        score++;
        selectedBtn.classList.remove('bg-white/10', 'hover:bg-white/20');
        selectedBtn.classList.add('bg-emerald-600', 'border-emerald-400', 'text-white');
      } else {
        selectedBtn.classList.remove('bg-white/10', 'hover:bg-white/20');
        selectedBtn.classList.add('bg-rose-600', 'border-rose-400', 'text-white');

        if (buttons[q.answer]) {
          buttons[q.answer].classList.remove('bg-white/10');
          buttons[q.answer].classList.add('bg-emerald-600/80', 'border-emerald-400');
        }
      }

      document.getElementById('score-count').innerText = `النقاط: ${score}`;

      setTimeout(() => {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentQuestions.length) {
          showQuestion();
        } else {
          showResults();
        }
      }, 1000);
    }

    function showResults() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      document.getElementById('final-score').innerText = `${score} / ${currentQuestions.length}`;

      const resText = document.getElementById('result-text');
      const resIcon = document.getElementById('result-icon');

      const percentage = (score / currentQuestions.length) * 100;

      if (percentage === 100) {
        resIcon.innerText = "🏆";
        resText.innerText = "ممتاز جداً! إجاباتك مثالية 100%!";
      } else if (percentage >= 70) {
        resIcon.innerText = "🌟";
        resText.innerText = "أداء رائع جداً!";
      } else if (percentage >= 50) {
        resIcon.innerText = "👍";
        resText.innerText = "أداء جيد، يمكنك المحاولة مجدداً.";
      } else {
        resIcon.innerText = "💡";
        resText.innerText = "حاول مرة أخرى لتنشيط معلوماتك!";
      }
    }
  </script>
</body>
</html>
